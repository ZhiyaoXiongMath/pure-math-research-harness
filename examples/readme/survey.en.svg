<text x="799" y="572" font-size="15" font-weight="400" fill="#4b6179" text-anchor="middle">New mathematics → knowledge / review</text>
<rect x="388" y="611" width="304" height="88" rx="14" fill="#e7f3ee" stroke="#a9d1c2" stroke-width="1.5"/>
<path d="M540 501 L540 606" fill="none" stroke="#167769" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="540" y="646" font-size="20" font-weight="700" fill="#146556" text-anchor="middle">Knowledge only → finish</text>
<text x="540" y="675" font-size="16" font-weight="400" fill="#146556" text-anchor="middle">Keep snapshot; no manuscript/PDF</text>
<rect x="738" y="611" width="304" height="88" rx="14" fill="#fcf2df" stroke="#dfc995" stroke-width="1.5"/>
<path d="M992 501 L992 606" fill="none" stroke="#355f9f" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="890" y="646" font-size="18" font-weight="700" fill="#805211" text-anchor="middle">Checked selected manuscript</text>
<text x="890" y="675" font-size="15" font-weight="400" fill="#805211" text-anchor="middle">Retain revisions and failed attempts</text>
<rect x="38" y="611" width="304" height="88" rx="14" fill="#fff" stroke="#cbd8e6" stroke-width="1.5"/>
<text x="190" y="646" font-size="18" font-weight="700" fill="#355f9f" text-anchor="middle">Reentry needs concrete grounds</text>
<text x="190" y="675" font-size="15" font-weight="400" fill="#4b6179" text-anchor="middle">Changed input, issue, bounded work</text>
<rect x="38" y="736" width="1004" height="75" rx="14" fill="#fff" stroke="#d8e1eb" stroke-width="1.5"/>
<text x="60" y="767" font-size="20" font-weight="600" fill="#805211" text-anchor="start">Human handoff: exact statement / scope → new paused TRH or FDH</text>
<text x="60" y="796" font-size="17" font-weight="400" fill="#4b6179" text-anchor="start">Start with separate authorization. Adoption grants no proof status; ended surveys stay ended.</text>
</svg>
