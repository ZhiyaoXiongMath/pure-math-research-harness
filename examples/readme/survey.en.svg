<text x="409" y="463" font-size="16" font-weight="400" fill="#167769" text-anchor="start">A snapshot is not readiness</text>
<text x="759" y="463" font-size="15" font-weight="400" fill="#986316" text-anchor="start">minimal · thematic · lecture</text>
