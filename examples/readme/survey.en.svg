<text x="409" y="174" font-size="18" font-weight="700" fill="#167769" text-anchor="start">S3–S4</text>
<text x="409" y="211" font-size="23" font-weight="700" fill="#152a43" text-anchor="start">Knowledge &amp; readiness</text>
<rect x="738" y="137" width="304" height="363" rx="14" fill="#fff" stroke="#d8e1eb" stroke-width="1.5"/>
<text x="759" y="174" font-size="18" font-weight="700" fill="#986316" text-anchor="start">S5–S7</text>
<text x="759" y="211" font-size="23" font-weight="700" fill="#152a43" text-anchor="start">Optional English survey</text>
<text x="59" y="251" font-size="17" font-weight="700" fill="#355f9f" text-anchor="start">S0</text>
<text x="105" y="251" font-size="18" font-weight="600" fill="#152a43" text-anchor="start">Scope &amp; authorization</text>
<text x="59" y="280" font-size="15" font-weight="400" fill="#4b6179" text-anchor="start">Questions, scope and boundaries</text>
<text x="59" y="325" font-size="17" font-weight="700" fill="#355f9f" text-anchor="start">S1</text>
<text x="105" y="325" font-size="18" font-weight="600" fill="#152a43" text-anchor="start">Literature investigation</text>
<text x="59" y="354" font-size="15" font-weight="400" fill="#4b6179" text-anchor="start">Actual queries, versions, selection</text>
<text x="59" y="399" font-size="17" font-weight="700" fill="#355f9f" text-anchor="start">S2</text>
<text x="105" y="399" font-size="18" font-weight="600" fill="#152a43" text-anchor="start">Source reading</text>
<text x="59" y="428" font-size="15" font-weight="400" fill="#4b6179" text-anchor="start">Locations, conditions, unread scope</text>
<text x="409" y="269" font-size="17" font-weight="700" fill="#355f9f" text-anchor="start">S3</text>
<text x="455" y="269" font-size="18" font-weight="600" fill="#152a43" text-anchor="start">Knowledge organization</text>
<text x="409" y="298" font-size="15" font-weight="400" fill="#4b6179" text-anchor="start">Definitions, results, mechanisms</text>
<text x="409" y="377" font-size="17" font-weight="700" fill="#355f9f" text-anchor="start">S4</text>
<text x="455" y="377" font-size="18" font-weight="600" fill="#152a43" text-anchor="start">Readiness review</text>
<text x="409" y="406" font-size="15" font-weight="400" fill="#4b6179" text-anchor="start">Independent tasks, exact scope</text>
<text x="759" y="251" font-size="17" font-weight="700" fill="#355f9f" text-anchor="start">S5</text>
<text x="805" y="251" font-size="18" font-weight="600" fill="#152a43" text-anchor="start">Snapshot &amp; plan</text>
<text x="759" y="280" font-size="15" font-weight="400" fill="#4b6179" text-anchor="start">Selection, audience, depth, type</text>
<text x="759" y="325" font-size="17" font-weight="700" fill="#355f9f" text-anchor="start">S6</text>
<text x="805" y="325" font-size="18" font-weight="600" fill="#152a43" text-anchor="start">Survey writing</text>
<text x="759" y="354" font-size="15" font-weight="400" fill="#4b6179" text-anchor="start">Write from frozen knowledge</text>
<text x="759" y="399" font-size="17" font-weight="700" fill="#355f9f" text-anchor="start">S7</text>
<text x="805" y="399" font-size="18" font-weight="600" fill="#152a43" text-anchor="start">Review &amp; delivery</text>
<text x="759" y="428" font-size="15" font-weight="400" fill="#4b6179" text-anchor="start">Full text, actual PDF, every page</text>
