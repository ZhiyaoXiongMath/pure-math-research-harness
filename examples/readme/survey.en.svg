<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="850" viewBox="0 0 1080 850" role="img" aria-labelledby="title desc" lang="en" font-family="Noto Sans, Noto Sans CJK SC, DejaVu Sans, sans-serif">
<title id="title">SURVEY: knowledge investigation and optional manuscripts</title>
<desc id="desc">S0–S4 build and review knowledge; Knowledge only can finish there. Explicit manuscript selection enables S5–S7. Missing evidence or mathematics returns to the relevant knowledge activity.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9Z" fill="#355f9f"/></marker></defs>
<rect x="1" y="1" width="1078" height="848" rx="20" fill="#f4f7fb" stroke="#dae3ed" stroke-width="1.5"/>
<text x="38" y="55" font-size="31" font-weight="700" fill="#152a43" text-anchor="start">SURVEY · Investigate, understand, then choose</text>
<text x="38" y="94" font-size="20" font-weight="400" fill="#4b6179" text-anchor="start">Knowledge is a goal in its own right. Creation is paused, with zero model calls.</text>
<rect x="38" y="137" width="304" height="363" rx="14" fill="#fff" stroke="#d8e1eb" stroke-width="1.5"/>
<text x="59" y="174" font-size="18" font-weight="700" fill="#355f9f" text-anchor="start">S0–S2</text>
<text x="59" y="211" font-size="23" font-weight="700" fill="#152a43" text-anchor="start">Sources &amp; evidence</text>
