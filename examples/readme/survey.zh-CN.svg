<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="850" viewBox="0 0 1080 850" role="img" aria-labelledby="title desc" lang="zh-CN" font-family="Noto Sans, Noto Sans CJK SC, DejaVu Sans, sans-serif">
<title id="title">SURVEY：知识调查与按需综述</title>
<desc id="desc">S0–S4 建设和审查知识；仅建设知识可结束。显式选择稿件才进入 S5–S7；证据或数学缺口回到相关知识活动。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9Z" fill="#355f9f"/></marker></defs>
<rect x="1" y="1" width="1078" height="848" rx="20" fill="#f4f7fb" stroke="#dae3ed" stroke-width="1.5"/>
<text x="38" y="55" font-size="31" font-weight="700" fill="#152a43" text-anchor="start">SURVEY · 调查与综述</text>
<text x="38" y="94" font-size="20" font-weight="400" fill="#4b6179" text-anchor="start">知识是主目标；稿件由你另行选择。创建实例暂停，模型调用为零。</text>
<rect x="38" y="137" width="304" height="363" rx="14" fill="#fff" stroke="#d8e1eb" stroke-width="1.5"/>
<text x="59" y="174" font-size="18" font-weight="700" fill="#355f9f" text-anchor="start">S0–S2</text>
<text x="59" y="211" font-size="23" font-weight="700" fill="#152a43" text-anchor="start">材料与证据</text>
<rect x="388" y="137" width="304" height="363" rx="14" fill="#fff" stroke="#d8e1eb" stroke-width="1.5"/>
<text x="409" y="174" font-size="18" font-weight="700" fill="#167769" text-anchor="start">S3–S4</text>
<text x="409" y="211" font-size="23" font-weight="700" fill="#152a43" text-anchor="start">知识与就绪</text>
<rect x="738" y="137" width="304" height="363" rx="14" fill="#fff" stroke="#d8e1eb" stroke-width="1.5"/>
<text x="759" y="174" font-size="18" font-weight="700" fill="#986316" text-anchor="start">S5–S7</text>
<text x="759" y="211" font-size="23" font-weight="700" fill="#152a43" text-anchor="start">可选英文综述</text>
<text x="59" y="251" font-size="17" font-weight="700" fill="#355f9f" text-anchor="start">S0</text>
<text x="105" y="251" font-size="20" font-weight="600" fill="#152a43" text-anchor="start">范围与授权</text>
<text x="59" y="280" font-size="17" font-weight="400" fill="#4b6179" text-anchor="start">问题、对象、包含与排除范围</text>
<text x="59" y="325" font-size="17" font-weight="700" fill="#355f9f" text-anchor="start">S1</text>
<text x="105" y="325" font-size="20" font-weight="600" fill="#152a43" text-anchor="start">文献调查</text>
<text x="59" y="354" font-size="17" font-weight="400" fill="#4b6179" text-anchor="start">实际检索、版本与选择理由</text>
<text x="59" y="399" font-size="17" font-weight="700" fill="#355f9f" text-anchor="start">S2</text>
<text x="105" y="399" font-size="20" font-weight="600" fill="#152a43" text-anchor="start">原文阅读</text>
<text x="59" y="428" font-size="17" font-weight="400" fill="#4b6179" text-anchor="start">原文定位、条件与未读范围</text>
<text x="409" y="269" font-size="17" font-weight="700" fill="#355f9f" text-anchor="start">S3</text>
<text x="455" y="269" font-size="20" font-weight="600" fill="#152a43" text-anchor="start">知识组织</text>
<text x="409" y="298" font-size="17" font-weight="400" fill="#4b6179" text-anchor="start">定义、结论、机制与边界</text>
<text x="409" y="377" font-size="17" font-weight="700" fill="#355f9f" text-anchor="start">S4</text>
<text x="455" y="377" font-size="20" font-weight="600" fill="#152a43" text-anchor="start">就绪审查</text>
<text x="409" y="406" font-size="17" font-weight="400" fill="#4b6179" text-anchor="start">独立任务、准确版本、覆盖范围</text>
<text x="759" y="251" font-size="17" font-weight="700" fill="#355f9f" text-anchor="start">S5</text>
<text x="805" y="251" font-size="20" font-weight="600" fill="#152a43" text-anchor="start">快照与计划</text>
<text x="759" y="280" font-size="17" font-weight="400" fill="#4b6179" text-anchor="start">选材、读者、证明深度、类型</text>
<text x="759" y="325" font-size="17" font-weight="700" fill="#355f9f" text-anchor="start">S6</text>
<text x="805" y="325" font-size="20" font-weight="600" fill="#152a43" text-anchor="start">综述写作</text>
<text x="759" y="354" font-size="17" font-weight="400" fill="#4b6179" text-anchor="start">消费冻结知识；不直接添事实</text>
<text x="759" y="399" font-size="17" font-weight="700" fill="#355f9f" text-anchor="start">S7</text>
<text x="805" y="399" font-size="20" font-weight="600" fill="#152a43" text-anchor="start">审查与交付</text>
<text x="759" y="428" font-size="17" font-weight="400" fill="#4b6179" text-anchor="start">全文语义与实际 PDF 逐页检查</text>
<path d="M343 315 L384 315" fill="none" stroke="#355f9f" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M693 315 L734 315" fill="none" stroke="#355f9f" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="716" y="282" font-size="15" font-weight="600" fill="#986316" text-anchor="middle">选择稿件</text>
<text x="409" y="463" font-size="16" font-weight="400" fill="#167769" text-anchor="start">冻结 ≠ 已就绪</text>
<text x="759" y="463" font-size="15" font-weight="400" fill="#986316" text-anchor="start">minimal · thematic · lecture</text>
<path d="M483 501 L483 544 L191 544 L191 504" fill="none" stroke="#355f9f" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="7 6"/>
<text x="330" y="536" font-size="15" font-weight="400" fill="#4b6179" text-anchor="middle">缺证据 → 检索／阅读</text>
<path d="M929 501 L929 582 L632 582 L632 504" fill="none" stroke="#355f9f" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="7 6"/>
<text x="799" y="572" font-size="15" font-weight="400" fill="#4b6179" text-anchor="middle">新增数学 → 知识／审查</text>
<rect x="388" y="611" width="304" height="88" rx="14" fill="#e7f3ee" stroke="#a9d1c2" stroke-width="1.5"/>
<path d="M540 501 L540 606" fill="none" stroke="#167769" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="540" y="646" font-size="20" font-weight="700" fill="#146556" text-anchor="middle">仅建设知识 → 完成</text>
<text x="540" y="675" font-size="16" font-weight="400" fill="#146556" text-anchor="middle">保留快照，不生成文章／PDF</text>
<rect x="738" y="611" width="304" height="88" rx="14" fill="#fcf2df" stroke="#dfc995" stroke-width="1.5"/>
<path d="M992 501 L992 606" fill="none" stroke="#355f9f" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="890" y="646" font-size="18" font-weight="700" fill="#805211" text-anchor="middle">已检查的选定稿件</text>
<text x="890" y="675" font-size="15" font-weight="400" fill="#805211" text-anchor="middle">旧稿、失败与检查历史均保留</text>
<rect x="38" y="611" width="304" height="88" rx="14" fill="#fff" stroke="#cbd8e6" stroke-width="1.5"/>
<text x="190" y="646" font-size="18" font-weight="700" fill="#355f9f" text-anchor="middle">可迭代，但需具体依据</text>
<text x="190" y="675" font-size="15" font-weight="400" fill="#4b6179" text-anchor="middle">变化输入、具体问题、有限授权</text>
<rect x="38" y="736" width="1004" height="75" rx="14" fill="#fff" stroke="#d8e1eb" stroke-width="1.5"/>
<text x="60" y="767" font-size="20" font-weight="600" fill="#805211" text-anchor="start">人工交接：精确命题／范围 → 新的暂停 TRW 或 TFDW</text>
<text x="60" y="796" font-size="17" font-weight="400" fill="#4b6179" text-anchor="start">单独授权后启动；交接不会授予证明资格。更新已结束调查须创建关联实例。</text>
</svg>
