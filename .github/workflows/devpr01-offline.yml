name: PMRH DEV-PR-01 AST and synthetic offline guard

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture-and-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      PIP_NO_INDEX: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PMRH_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout source, without retained GitHub credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce original baseline and exact DEV03 read-section allowance
        shell: bash
        run: |
          set -euo pipefail
          BASE=e4de0210f9985224e030ac4cfd2f7e2904005b37
          test "$(git rev-parse "$BASE^{tree}")" = c17a592ff0a4906afa7a6423535f41c67c926128
          python3 -B scripts/check_legacy_scope.py
          test -z "$(git status --porcelain)"
          echo "LEGACY_FROZEN_SOURCE_CHECK=PASS"

      - name: Complete AST graph, layering rules and entrypoint risk audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pmrh-devpr01/ast"
          python3 -B scripts/architecture_deps.py \
            --check \
            --json "$RUNNER_TEMP/pmrh-devpr01/ast/dependency-graph.json" \
            --markdown "$RUNNER_TEMP/pmrh-devpr01/ast/architecture-audit.md"
          test -s "$RUNNER_TEMP/pmrh-devpr01/ast/dependency-graph.json"
          test -s "$RUNNER_TEMP/pmrh-devpr01/ast/architecture-audit.md"

      - name: Deny network/process/private paths and stage synthetic test evidence
        shell: bash
        run: |
          set -euo pipefail
          # Fresh trusted output root, separately from runner HOME; the child
          # uses only its synthetic fixture and cannot choose another suite.
          ARTIFACT_DIR="$(mktemp -d /tmp/pmrh-devpr01-artifacts-XXXXXXXX)"
          trap 'rm -rf "$ARTIFACT_DIR"' EXIT
          mkdir -p "$ARTIFACT_DIR/offline" "$RUNNER_TEMP/pmrh-devpr01/offline"
          TEST_EXIT=0
          PMRH_TEST_ARTIFACT_ROOT="$ARTIFACT_DIR" \
            python3 -B scripts/offline_test.py --suite devpr01 \
              --out "$ARTIFACT_DIR/offline" || TEST_EXIT=$?

          # Copy any available diagnostics on failure; NEVER swallow a copy
          # error. No successful job may depend on an EXIT trap with || true.
          for f in unittest.log receipt.json; do
            if test -f "$ARTIFACT_DIR/offline/$f"; then
              cp -a -- "$ARTIFACT_DIR/offline/$f" "$RUNNER_TEMP/pmrh-devpr01/offline/$f"
            fi
          done
          if test "$TEST_EXIT" -ne 0; then
            echo "The guarded child failed (exit=$TEST_EXIT); available evidence staged." >&2
            exit "$TEST_EXIT"
          fi
          test -z "$(git status --porcelain)"

      - name: Require complete four-file evidence and matching source hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/verify_devpr01_artifacts.py \
            --root "$RUNNER_TEMP/pmrh-devpr01" \
            --expected-head-sha "$PMRH_SOURCE_SHA"

      - name: Upload exact AST graphs and negative-test receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pmrh-devpr01-ast-and-offline-evidence
          path: ${{ runner.temp }}/pmrh-devpr01/
          if-no-files-found: error
          retention-days: 30
