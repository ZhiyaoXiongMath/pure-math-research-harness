name: DEV11 scoped offline candidate
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'pmrh/**'
      - 'research_studio/**'
      - 'tests/devpr11/**'
      - 'scripts/**'
      - 'config/architecture-exceptions.json'
      - '.github/workflows/devpr11-offline.yml'
permissions:
  contents: read
jobs:
  scoped:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - suite: ci-core
            timeout_minutes: 40
          - suite: ci-storage
            timeout_minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Root-pinned implementation parent
        run: |
          mkdir "$RUNNER_TEMP/dev11-parent"
          git archive 48b445f4370922d5535f7b6c4641066bd82fcfdc | tar -x -C "$RUNNER_TEMP/dev11-parent"
      - name: Verify root-pinned v8 oracle
        run: |
          python3 -B -c "from pathlib import Path; import hashlib; assert hashlib.sha256(Path('scripts/fastmath_scope_preintegration.json').read_bytes()).hexdigest() == 'dc8ef798e09f31928ca683431e14fe962aff8ccbe0303b6e397e461c248866a8'"
      - name: Exact staged source scope
        run: |
          python3 -B scripts/fastmath_scope.py
          python3 -B scripts/check_legacy_scope.py
          python3 -B scripts/architecture_deps.py --check --json "$RUNNER_TEMP/dev11-architecture.json" --markdown "$RUNNER_TEMP/dev11-architecture.md"
      - name: Install OS isolation tool on ephemeral hosted Linux
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Configure ephemeral hosted runner for unprivileged namespaces
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          mkdir -p "$RUNNER_TEMP/pmrh-devpr11"
          # Ubuntu's AppArmor userns restriction can deny bwrap loopback setup.
          # Change only this ephemeral job's host setting, never the confinement.
          if test -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns > "$RUNNER_TEMP/pmrh-devpr11/apparmor-userns-original.txt"
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 | tee "$RUNNER_TEMP/pmrh-devpr11/namespace-setup.log"
            test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 0
          else
            echo 'AppArmor userns restriction sysctl absent; no adjustment applied.' > "$RUNNER_TEMP/pmrh-devpr11/namespace-setup.log"
          fi
      - name: Confined synthetic suite; no fallback
        run: python3 -B scripts/offline_fastmath.py --oracle "$RUNNER_TEMP/dev11-parent" --out "$RUNNER_TEMP/dev11-results" --suite "${{ matrix.suite }}"
      - name: Restore hosted runner namespace setting
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -f "$RUNNER_TEMP/pmrh-devpr11/apparmor-userns-original.txt"; then
            test "$RUNNER_ENVIRONMENT" = github-hosted
            test "$RUNNER_OS" = Linux
            DEV11_USERNS_ORIGINAL="$(cat "$RUNNER_TEMP/pmrh-devpr11/apparmor-userns-original.txt")"
            case "$DEV11_USERNS_ORIGINAL" in 0|1) ;; *) exit 1 ;; esac
            sudo sysctl -w "kernel.apparmor_restrict_unprivileged_userns=$DEV11_USERNS_ORIGINAL" | tee "$RUNNER_TEMP/pmrh-devpr11/namespace-restore.log"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dev11-scoped-evidence-${{ matrix.suite }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/dev11-results
            ${{ runner.temp }}/dev11-architecture.json
            ${{ runner.temp }}/dev11-architecture.md
            ${{ runner.temp }}/pmrh-devpr11/
