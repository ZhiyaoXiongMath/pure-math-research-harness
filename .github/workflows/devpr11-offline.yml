name: DEV11 scoped offline candidate
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'pmrh/**'
      - 'research_studio/**'
      - 'tests/devpr11/**'
      - 'scripts/**'
      - 'config/architecture-exceptions.json'
      - '.github/workflows/devpr11-offline.yml'
permissions:
  contents: read
jobs:
  scoped:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Root-pinned implementation parent
        run: |
          mkdir "$RUNNER_TEMP/dev11-parent"
          git archive 48b445f4370922d5535f7b6c4641066bd82fcfdc | tar -x -C "$RUNNER_TEMP/dev11-parent"
      - name: Verify root-pinned v6 oracle
        run: |
          python3 -B -c "from pathlib import Path; import hashlib; assert hashlib.sha256(Path('scripts/fastmath_scope_preintegration.json').read_bytes()).hexdigest() == 'fa4823bf89d291d8c8f8d1607aa8d3a513d4d53c932bcaac80411117066a1604'"
      - name: Exact staged source scope
        run: |
          python3 -B scripts/fastmath_scope.py
          python3 -B scripts/check_legacy_scope.py
          python3 -B scripts/architecture_deps.py --check --json "$RUNNER_TEMP/dev11-architecture.json" --markdown "$RUNNER_TEMP/dev11-architecture.md"
      - name: Confined synthetic suite; no fallback
        run: python3 -B scripts/offline_fastmath.py --oracle "$RUNNER_TEMP/dev11-parent" --out "$RUNNER_TEMP/dev11-results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dev11-scoped-evidence
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/dev11-results
            ${{ runner.temp }}/dev11-architecture.json
            ${{ runner.temp }}/dev11-architecture.md
