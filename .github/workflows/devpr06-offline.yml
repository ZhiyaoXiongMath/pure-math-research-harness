name: PMRH DEV-PR-06 synthetic control admission

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      PIP_NO_INDEX: '1'
      PMRH_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact head without retained credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install OS isolation tool
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Configure ephemeral hosted runner for unprivileged S2 namespaces
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          mkdir -p "$RUNNER_TEMP/pmrh-devpr06"
          # Ubuntu's AppArmor userns restriction can deny bwrap loopback setup.
          # Change only this ephemeral job's host setting, never the S2 boundary.
          if test -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns > "$RUNNER_TEMP/pmrh-devpr06/apparmor-userns-original.txt"
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 | tee "$RUNNER_TEMP/pmrh-devpr06/namespace-setup.log"
            test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 0
          else
            echo 'AppArmor userns restriction sysctl absent; no adjustment applied.' > "$RUNNER_TEMP/pmrh-devpr06/namespace-setup.log"
          fi
      - name: Check exact scope and run isolated control and affected regression tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PMRH_SOURCE_SHA"
          mkdir -p "$RUNNER_TEMP/pmrh-devpr06"
          python -B scripts/check_legacy_scope.py > "$RUNNER_TEMP/pmrh-devpr06/legacy-scope.log"
          python -B scripts/architecture_deps.py --check \
            --json "$RUNNER_TEMP/pmrh-devpr06/dependencies.json" \
            --markdown "$RUNNER_TEMP/pmrh-devpr06/architecture.md"
          git archive HEAD > "$RUNNER_TEMP/pmrh-devpr06/source.tar"
          ORACLE_DIR="$(mktemp -d "$RUNNER_TEMP/dev06-oracle-XXXXXXXX")"
          git archive 2c65af1a407c159d6768867bf25c03566c4657c1 | tar -xf - -C "$ORACLE_DIR"
          chmod -R a-w "$ORACLE_DIR"
          python -B scripts/offline_control.py --out "$RUNNER_TEMP/pmrh-devpr06/s2" --oracle "$ORACLE_DIR"
          test -z "$(git status --porcelain)"
      - name: Restore hosted runner namespace setting
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -f "$RUNNER_TEMP/pmrh-devpr06/apparmor-userns-original.txt"; then
            test "$RUNNER_ENVIRONMENT" = github-hosted
            DEV06_USERNS_ORIGINAL="$(cat "$RUNNER_TEMP/pmrh-devpr06/apparmor-userns-original.txt")"
            case "$DEV06_USERNS_ORIGINAL" in 0|1) ;; *) exit 1 ;; esac
            sudo sysctl -w "kernel.apparmor_restrict_unprivileged_userns=$DEV06_USERNS_ORIGINAL" | tee "$RUNNER_TEMP/pmrh-devpr06/namespace-restore.log"
          fi
      - name: Upload source and all available receipts including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pmrh-devpr06-${{ env.PMRH_SOURCE_SHA }}-py${{ matrix.python }}
          path: ${{ runner.temp }}/pmrh-devpr06/
          if-no-files-found: error
          retention-days: 30
